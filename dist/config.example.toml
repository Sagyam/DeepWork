# /etc/deepwork/config.toml
# Machine-specific copy: put it in dist/config.local.toml (gitignored) and
# install.sh uses that instead.
# Every key is optional. A [profiles] table replaces the built-in profile.

[dns]
port = 5454
# Upstreams the forwarder uses during sessions, tried in order.
# Plain: "192.168.1.1:53". DNS-over-TLS: { addr = "...:853", tls_name = "..." }.
# Use the same servers as /etc/systemd/resolved.conf. For NextDNS:
#   { addr = "45.90.28.0:853", tls_name = "<your-id>.dns.nextdns.io" },
upstreams = [
    { addr = "9.9.9.9:853", tls_name = "dns.quad9.net" },
    { addr = "1.1.1.1:853", tls_name = "cloudflare-dns.com" },
]
# Point systemd-resolved at the forwarder during sessions (runtime drop-in in
# /run/systemd/resolved.conf.d). Required when resolved uses DNS-over-TLS.
manage_resolved = true
# During sessions, DNS that containers / VMs send to other servers (forwarded
# port 53 from docker*, br-*, virbr*) goes here instead. Point it at a host
# resolver that goes through deepworkd, e.g. resolved with
# DNSStubListenerExtra=172.17.0.1. Unset: such queries are refused.
# container_dns = "172.17.0.1:53"

[[dns.forward]]
suffix = "ts.net"
server = "100.100.100.100:53"

[session]
default_profile = "deep"
stopwatch_min_secs = 600
surrender_wait_secs = 600

[schedule]
# Notifications and the bar warn this long before a routine starts.
heads_up_secs = 300
# Routine runs you may skip per week (Monday to Sunday): `deepwork skip`.
skip_tokens_per_week = 2

# Reminders to start a session, inside active hours, when none has run for a
# while. Each repeat is more urgent than the last.
[nudge]
enabled = true
days = []          # every day; or e.g. ["mon", "tue", "wed", "thu", "fri"]
from = "09:00"
until = "21:00"
after_mins = 30
repeat_mins = 15

# Routines start a countdown on their own at `start` (local time). If the
# machine was asleep or another session was running, the run starts late with
# whatever is left of its window. Each run happens at most once.
# [[routines]]
# name = "morning"
# days = ["mon", "tue", "wed", "thu", "fri"]
# start = "09:00"
# duration_mins = 90
# profile = "deep"   # optional, default_profile otherwise

[profiles.deep]
block_quic = true
# Added round-trip time (split across both directions), jitter, bandwidth cap.
throttle = { rtt_ms = 400, jitter_ms = 50, rate_kbit = 256, loss_pct = 0.0 }
# Harsher throttles the longer throttled sites are actually used in a session
# (15s windows with real traffic count). Omit for these defaults; [] for off.
escalation = [
    { after_mins = 10, throttle = { rtt_ms = 500, jitter_ms = 50, rate_kbit = 192 } },
    { after_mins = 20, throttle = { rtt_ms = 600, jitter_ms = 50, rate_kbit = 128 } },
]
rules = [
    { domain = "youtube.com" },
    { domain = "youtu.be" },
    { domain = "googlevideo.com" },
    { domain = "ytimg.com" },
    { domain = "reddit.com" },
    { domain = "redd.it" },
    { domain = "redditmedia.com" },
    { domain = "redditstatic.com" },
    { domain = "x.com" },
    { domain = "twitter.com" },
    { domain = "twimg.com" },
    { domain = "instagram.com", action = "block" },
    { domain = "cdninstagram.com", action = "block" },
]
