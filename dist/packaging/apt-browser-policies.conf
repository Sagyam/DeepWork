// Installed by DeepWork as /etc/apt/apt.conf.d/80deepwork-browser-policies.
// Browser package updates replace distribution/policies.json; put the
// DeepWork policies (DNS-over-HTTPS and ECH off) back right away. The daemon
// also re-applies them every minute.
DPkg::Post-Invoke { "if [ -x /usr/bin/deepworkd ]; then /usr/bin/deepworkd --browser-policies apply >/dev/null 2>&1 || true; fi"; };
