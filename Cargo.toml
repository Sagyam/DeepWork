[workspace]
resolver = "3"
members = ["crates/proto", "crates/daemon", "crates/cli", "crates/agent", "ui/src-tauri"]
# The Tauri app pulls in webkit2gtk; build it with `cargo build -p deepwork-ui`.
default-members = ["crates/proto", "crates/daemon", "crates/cli", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
deepwork-proto = { path = "crates/proto" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hickory-proto = "0.26"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process", "fs"] }
toml = "1"
toml_edit = "0.25"
jiff = "0.2"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dependencies build without debug info in dev: it was most of target/debug
# (several GB) and is rarely needed. Our own crates keep full debug info.
[profile.dev.package."*"]
debug = false
