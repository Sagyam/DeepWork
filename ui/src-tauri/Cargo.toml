[package]
name = "deepwork-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
deepwork-proto.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
# Serve the built frontend (`ui/dist`) from the binary. Without it the window
# is a dev build that loads the Vite dev server on localhost:5173. The Tauri
# CLI turns it on for `tauri build`; plain cargo builds must ask for it.
custom-protocol = ["tauri/custom-protocol"]
