name: ci

# Lint and test pull requests and pushes to main that touch code. Each job runs
# only for its own changes. Building packages is covered by package.yml and
# release.yml; this checks the install scripts and the PAM hook.

on:
  pull_request:
    paths: &code
      - "crates/**"
      - "ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dist/**"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths: *code

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # "every": a file counts only if it matches all of a filter's patterns.
          filters: |
            rust:
              - "{crates/**,ui/src-tauri/**,Cargo.toml,Cargo.lock,.github/workflows/ci.yml}"
              - "!**/*.md"
            ui:
              - "{ui/**,.github/workflows/ci.yml}"
              - "!ui/src-tauri/**"
              - "!**/*.md"
            scripts:
              - "{dist/**,.github/workflows/ci.yml}"
          predicate-quantifier: every

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      # --workspace: the Tauri crate (deepwork-ui) is not a default member.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  ui:
    name: UI
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  scripts:
    name: Scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # shellcheck ships with the runner image.
      - run: shellcheck --severity=warning dist/*.sh dist/packaging/*.sh
      - run: python3 -I -m unittest discover -s dist -p '*_test.py'
