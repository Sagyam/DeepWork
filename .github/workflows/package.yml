name: package

# Builds the Arch package from dist/PKGBUILD and keeps the built package as an
# artifact you can download and install with `pacman -U`. No signing yet.
#
# AUR publishing is off the table for now (registrations closed); when they
# open, the same package can be pushed as `deepwork-git`. Tags go through
# release.yml, which calls this workflow and attaches the package.

on:
  push:
    branches: [main]
    # Only what ends up in the package. Docs, CI config for other workflows
    # and the release-only scripts (get.sh, install.sh, packaging/) don't
    # trigger a build; release.yml calls this workflow regardless.
    paths:
      - "crates/**"
      - "ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dist/PKGBUILD"
      - "dist/.SRCINFO"
      - "dist/deepwork-git.install"
      - "dist/*.service"
      - "dist/*.hook"
      - "dist/*.rules"
      - "dist/*.desktop"
      - "dist/pam.py"
      - "dist/config.example.toml"
      - ".github/workflows/package.yml"
      - "!**/*.md"
  workflow_dispatch:
  workflow_call:

# Per caller: release.yml runs this for the same ref as a push to main.
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arch:
    name: Arch package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    timeout-minutes: 90

    steps:
      # The image ships a stale keyring. git has to be there before checkout,
      # which otherwise downloads a tarball with no history for makepkg.
      - name: Install git
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git sudo

      # Full history: pkgver() counts commits and reads tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # makepkg refuses to run as root, so everything below runs as `builder`.
      - name: Add a build user
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # Catch a PKGBUILD edited without regenerating dist/.SRCINFO.
      - name: Check .SRCINFO is current
        run: |
          sudo -u builder env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -c 'cd "$GITHUB_WORKSPACE/dist" && makepkg --printsrcinfo | diff -u .SRCINFO -'

      # The PKGBUILD clones main from GitHub; build this exact commit instead
      # (a tag, or a push that main has already moved past).
      - name: Point the PKGBUILD at this checkout
        run: |
          sed -i "s|^source=.*|source=(\"\$pkgname::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" dist/PKGBUILD
          grep '^source=' dist/PKGBUILD

      - name: Build
        run: |
          sudo -u builder env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -c 'cd "$GITHUB_WORKSPACE/dist" && makepkg --syncdeps --noconfirm --force'

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: deepwork-git-x86_64
          path: |
            dist/*.pkg.tar.zst
            !dist/*-debug-*.pkg.tar.zst
          if-no-files-found: error
